[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-football-model"
version = "0.1.0"
description = "Football ML/AI platform: match-outcome models benchmarked against bookmaker odds, served via FastAPI, with a grounded LLM analyst"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ste Jackson", email = "stephenjackson.career@outlook.com" },
    { name = "George" },
]
keywords = ["football", "machine-learning", "mlflow", "fastapi", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "pre-commit>=4.7.0",
]
docs = [
    "zensical>=0.0.71,<0.2",
]

[project.urls]
Homepage = "https://github.com/stejackson94/SG-football-model"
Repository = "https://github.com/stejackson94/SG-football-model.git"
Issues = "https://github.com/stejackson94/SG-football-model/issues"
Documentation = "https://github.com/stejackson94/SG-football-model#readme"

[tool.uv]
managed = true
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/test"]
addopts = "-v --tb=short"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
]
ignore = [
    "F403",  # Star imports are used intentionally in __init__.py
    "F405",  # May be undefined from star imports (too many false positives)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/test/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv.workspace]
members = []
